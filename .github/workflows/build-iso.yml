name: Build Guix ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            system: x86_64-linux
            ext: iso
          - arch: aarch64
            system: aarch64-linux
            ext: raw.xz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=v0.20.6 BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore Guix store cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: guix-store-${{ matrix.arch }}

      - name: Prepare cache placeholder
        run: |
          mkdir -p cache
          [ -s cache/guix-cache.tar.gz ] || : > cache/guix-cache.tar.gz

      - name: Build image and refresh store cache
        run: dagger call build --arch=${{ matrix.arch }} --cache=./cache/guix-cache.tar.gz export --path=./out

      - name: Move refreshed cache into place
        run: mv -f ./out/guix-cache.tar.gz ./cache/guix-cache.tar.gz

      - name: Save Guix store cache
        uses: actions/cache/save@v4
        with:
          path: cache
          key: guix-store-${{ matrix.arch }}

      - name: Publish image as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "iso-${{ github.run_number }}-${{ matrix.arch }}"
          name: "Guix Install Image (${{ matrix.arch }}) — build ${{ github.run_number }}"
          body: |
            Reproducible Guix installation image, built from the pinned
            channel in `channels.scm`.

            - Target: ${{ matrix.system }}
            - Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: out/guix-install-${{ matrix.arch }}-linux.${{ matrix.ext }}
          draft: false
          prerelease: false
